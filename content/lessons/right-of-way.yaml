  - id: row-q5
    ask: "You are the blue car. Who goes first?"
    scene: row-driveway
    step: question-freeze
    choices: ["You, the blue car.", "You both go at once.", "The red car.", "The faster car."]
    answer: 2
    explainCard: row-driveway
    source:
      page: 34
      quote: "A vehicle that enters a roadway from a driveway, private road or another place that is not a roadway, must stop and yield the right-of-way to traffic on the roadway and to pedestrians."
