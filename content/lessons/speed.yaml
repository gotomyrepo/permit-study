      quote: "Even if there is no minimum speed limit, those driving too slow can be as dangerous as those who drive too fast."
  - id: speed-q4
    ask: "You are driving in New York City. There is no speed limit sign. What is the speed limit?"
    scene: speed-city
    step: question
    choices: ["15 miles per hour.", "25 miles per hour.", "55 miles per hour.", "65 miles per hour."]
    answer: 1
    explainCard: speed-city
